<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a110a">
<title>Panel Pengelola — WARUNGKU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pine:#1a110a;--pine2:#2a1a0e;--green:#e07b0f;--mint:#fff0da;--orange:#f49a38;--red:#c8443b;--ink:#14231c;--mut:#6c7a71;--bg:#f2f4ef;--card:#fff;--line:#e3e8e0;--r:16px}
*{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #f5c78a;outline-offset:2px}
[hidden]{display:none!important}h1,h2,h3,p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:11px;font-weight:700;background:#fff;border:1px solid var(--line);transition:.15s}
.btn:hover{border-color:#c5cfc7}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}.btn.pri:hover{background:var(--pine2)}
.btn.dng{color:var(--red)}.btn.sm{padding:6px 11px;font-size:12px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
textarea{resize:vertical;min-height:70px}label{display:block;font-weight:600;font-size:12px;color:var(--mut);margin:0 0 5px}
.fld{margin-bottom:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
/* Kunci */
#lock{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 15% 0,#4a2a0c 0,transparent 60%),var(--pine)}
.lockbox{width:min(100%,380px);background:#fff;border-radius:24px;padding:30px 26px;box-shadow:0 30px 60px #0006}
.mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,#ffb347,#e07b0f);box-shadow:inset 0 2px 3px #fff5,0 5px 0 #1a110a33}
.lockbox h1{font-size:22px;letter-spacing:-.5px;margin:18px 0 4px}.lockbox p{color:var(--mut);margin-bottom:18px}
.err{color:var(--red);font-size:12px;min-height:18px;margin:6px 0 8px;font-weight:600}
/* Rangka */
#app{min-height:100vh}
aside{background:var(--pine);color:#e8d9c6;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 20px}.brand .mark{width:42px;height:42px;font-size:22px;border-radius:13px}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.2}.brand span{font-size:11px;opacity:.7}
.nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;font-weight:600;color:#e8d9c6;text-align:left;width:100%}
.nav:hover{background:#ffffff12}.nav.on{background:#fff;color:var(--pine)}.nav i{font-style:normal;font-size:17px;width:22px;text-align:center}
.nav .n{margin-left:auto;background:var(--orange);color:#3b2400;border-radius:99px;font-size:11px;font-weight:800;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;display:grid;gap:6px}
main{padding:26px clamp(16px,3vw,38px) 130px;max-width:1120px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:26px;letter-spacing:-.8px}.top p{color:var(--mut)}
.sw{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;font-weight:700;cursor:pointer}
.sw input{display:none}.sw .t{width:38px;height:22px;border-radius:99px;background:#c9d1cb;position:relative;transition:.2s}
.sw .t::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw input:checked+.t{background:var(--green)}.sw input:checked+.t::after{left:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-size:15px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.stat{padding:18px 20px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat span{color:var(--mut);font-size:12px;font-weight:600}.stat b{display:block;font-size:24px;letter-spacing:-.8px;margin-top:4px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.cols+.cols,.card+.card{margin-top:16px}
.bars{width:100%;height:auto}.bars text{font-size:9px;fill:var(--mut)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0;padding-bottom:0}
.row .g{flex:1;min-width:0}.row .g b{display:block;overflow-wrap:anywhere}.row .g small{color:var(--mut)}
.thumb{width:44px;height:44px;border-radius:13px;background:var(--mint);display:grid;place-items:center;font-size:23px;flex-shrink:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#eef1ec;color:var(--mut)}
.tag.w{background:#fff1dc;color:#9a5a00}.tag.g{background:var(--mint);color:var(--green)}.tag.r{background:#fde7e5;color:var(--red)}.tag.b{background:#e3eefb;color:#2b5d9b}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar input,.bar select{flex:1;min-width:150px;width:auto}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{white-space:nowrap;padding:7px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:12px}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.order{padding:18px}.order+.order{margin-top:12px}
.oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.oh small{color:var(--mut);display:block}
.items{background:var(--bg);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13px}.items div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.of{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.of select{width:auto;min-width:200px}
.empty{text-align:center;padding:38px 16px;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:16px;margin:6px 0 2px}.empty i{font-style:normal;font-size:34px}
.mini{width:46px;height:26px}
.cust{font-size:13px;line-height:1.7;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.cust a{color:var(--green);font-weight:700}
.order.new{animation:pulse 1.6s ease-out 2}@keyframes pulse{0%{box-shadow:0 0 0 0 #f49a3866}100%{box-shadow:0 0 0 18px #f49a3800}}
dialog{border:0;border-radius:22px;padding:0;width:min(100%,560px);max-height:92vh;box-shadow:0 30px 70px #0007}
dialog::backdrop{background:#0b1d15aa}.dl{padding:24px}.dl h3{font-size:18px;margin-bottom:16px}.dl .of{margin-top:6px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);background:var(--pine);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.tact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btm{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),560px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 14px 40px #1a110a2e;z-index:50}
.btm button{display:grid;justify-items:center;gap:1px;padding:7px 0;font-size:11px;font-weight:700;color:var(--mut);border-radius:16px;position:relative;transition:.15s}
.btm button:hover{background:var(--bg)}.btm i{font-style:normal;font-size:20px}.btm .on{color:#fff;background:var(--pine)}
.btm .n{position:absolute;top:2px;right:calc(50% - 26px);background:var(--orange);color:#3b2400;border-radius:99px;font-size:10px;font-weight:800;padding:0 6px;min-width:18px;text-align:center}
@media(max-width:860px){
.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
.cols{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.top h2{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Penyempurnaan tampilan ===== */
:root{--sh:0 1px 2px #1a110a0a,0 10px 28px #1a110a0f}
body{background:linear-gradient(180deg,#fdebd0 0,#fbf7f1 340px) no-repeat,#fbf7f1;letter-spacing:-.005em}
main{padding-top:30px}
.top{align-items:flex-end;margin-bottom:26px;gap:16px}
.crumb{display:flex;align-items:center;gap:9px;color:var(--green);font-weight:700;font-size:13px;margin-bottom:10px}
.crumb .mark{width:30px;height:30px;font-size:16px;border-radius:10px;box-shadow:none}
.top h2{font-size:30px;font-weight:800;letter-spacing:-1.1px;line-height:1.15}.top p{margin-top:4px;font-size:14px}
.tact{background:#ffffffb8;backdrop-filter:blur(8px);border:1px solid #fff;border-radius:99px;padding:5px;box-shadow:var(--sh)}
.tact .btn,.tact .sw{border:0;background:transparent;border-radius:99px;padding:8px 14px}.tact .btn:hover,.tact .sw:hover{background:var(--bg)}
.tact .sw{padding-left:8px}
.card{border:1px solid #e8eee6;border-radius:22px;padding:24px;box-shadow:var(--sh)}
.card h3{font-size:16px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.card .hint,.card>p{font-size:13px;line-height:1.55}.hint{color:var(--mut);margin-bottom:18px}
.card h3+.fld,.card h3+.grid2{margin-top:16px}
.btn{border-radius:12px;padding:10px 16px;font-weight:700;box-shadow:0 1px 2px #1a110a0d}
.btn.pri{background:linear-gradient(180deg,#0a8a61,#e07b0f);box-shadow:0 6px 16px #e07b0f38}
.btn.pri:hover{background:linear-gradient(180deg,#0c9a6d,#0a7f59)}
.btn.dng{background:#fff5f4;border-color:#f6d4d1}.btn.dng:hover{background:#fde7e5}
input,select,textarea{height:44px;border-radius:12px;border-color:#dde5dc;background:#fbfcfa;transition:.15s}
textarea{height:auto}input:hover,select:hover,textarea:hover{border-color:#bccabf}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--green);background:#fff;box-shadow:0 0 0 4px #e07b0f1f}
label{font-size:12.5px;color:#4d5d54;margin-bottom:6px}.fld{margin-bottom:16px}.grid2{gap:0 16px}
/* statistik */
.stats{background:none;border:0;gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #e8eee6!important;border-radius:22px;padding:20px;box-shadow:var(--sh);display:grid;gap:2px}
.stat .ic{font-style:normal;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;margin-bottom:12px;background:var(--mint)}
.ic.b{background:#e3eefb}.ic.w{background:#fff1dc}.ic.r{background:#fde7e5}
.stat span{font-size:12.5px;font-weight:600}.stat b{font-size:26px;font-weight:800;letter-spacing:-1px;margin:0}
.cols{gap:16px}.cols+.cols,.card+.card,.cols+.card{margin-top:16px}
/* baris */
.row{padding:14px 0}.row .g b{font-weight:700}.row .g small{font-size:12.5px}
.tag{padding:3px 10px;font-weight:700}
/* pesanan */
.chips{gap:8px;margin-bottom:18px;padding:2px 2px 8px}
.chip{padding:8px 15px;font-size:12.5px;box-shadow:0 1px 2px #1a110a0a}.chip:hover{border-color:#bccabf}
.chip.on{box-shadow:0 6px 14px #1a110a33}
.order{padding:22px 24px;border-left:5px solid #cfd8d1}.order+.order{margin-top:14px}
.order.tw{border-left-color:var(--orange)}.order.tb{border-left-color:#4b86c8}.order.tg{border-left-color:var(--green)}.order.tr{border-left-color:var(--red)}
.oh b{font-size:16px;font-weight:800}.oh small{font-size:12.5px;margin-top:2px}
.items{background:#f6f8f4;border:1px solid #edf1ea;border-radius:14px;padding:12px 16px;margin:14px 0 16px}.items div{padding:5px 0}
.items div+div{border-top:1px dashed #dfe6dc}
.of{gap:12px}.of>div:first-child b{font-size:18px;letter-spacing:-.4px}
/* produk */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pgrid .empty{grid-column:1/-1;background:#fff;border-radius:22px;box-shadow:var(--sh)}
.pc{background:#fff;border:1px solid #e8eee6;border-radius:22px;padding:18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:14px;transition:.2s}
.pc:hover{transform:translateY(-2px);box-shadow:0 2px 4px #1a110a0a,0 16px 34px #1a110a18}
.pc.off{background:#fafbf9}.pc.off .thumb{filter:grayscale(.9);opacity:.7}
.pt{display:flex;gap:14px;align-items:center}.pt .thumb{width:58px;height:58px;border-radius:17px;font-size:29px}
.pt b{display:block;font-size:15px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}.pt small{color:var(--mut);font-size:12.5px}
.pp{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.pp strong{font-size:21px;font-weight:800;letter-spacing:-.8px}
.pf{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line)}.pf .sw{margin-right:auto}
.pf .btn{padding:7px 13px}
/* dialog */
dialog{border-radius:26px;width:min(calc(100% - 24px),600px)}.dl{padding:28px}.dl h3{font-size:20px;font-weight:800;letter-spacing:-.6px;margin-bottom:20px}
.dl .of{margin-top:10px;justify-content:flex-end}
/* dock */
.btm{background:#ffffffe6;backdrop-filter:blur(14px);border-color:#fff;border-radius:24px;padding:7px;box-shadow:0 18px 44px #1a110a33}
.btm button{border-radius:17px;padding:9px 0}.btm .on{box-shadow:0 6px 14px #1a110a44}
/* kunci */
.lockbox{border-radius:28px;padding:36px 30px}.lockbox h1{font-size:24px;font-weight:800}
section:not([hidden]){animation:in .28s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(max-width:860px){.top{align-items:flex-start}.top h2{font-size:25px}.tact{width:100%;justify-content:space-between}.card{padding:20px}.stat{padding:16px}.stat b{font-size:22px}.order{padding:18px}.pgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){section:not([hidden]){animation:none}.pc{transition:none}}
/* peta lokasi warung */
.msearch{position:relative;margin-bottom:10px}
.mres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:1100;max-height:260px;overflow-y:auto;padding:6px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px #1a110a33}
.mres button{display:block;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.mres button:hover{background:var(--bg)}
.mres b{display:block;font-size:13px}.mres small{display:block;color:var(--mut);font-size:11px;line-height:1.4}
.mnote{padding:12px;text-align:center;color:var(--mut);font-size:12px}
.smap{height:300px;border-radius:16px;overflow:hidden;isolation:isolate;border:1px solid var(--line)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.mrow .hint{margin:0;font-size:12px}
.wk-mk{background:none;border:0}
.wk-mk .mk{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#fff;border:3px solid var(--green);font-size:19px;box-shadow:0 6px 14px #2b16053d}
.wk-mk .mk::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:6px solid transparent;border-top:8px solid var(--green);border-bottom:0}
.leaflet-container{font-family:inherit}
a.btn{text-decoration:none;color:var(--ink)}a.btn.pri{color:#fff}
.btn.pri{background:linear-gradient(180deg,#f7a43c,#e07b0f);border-color:#e07b0f;box-shadow:0 6px 16px #e07b0f38}.btn.pri:hover{background:linear-gradient(180deg,#f5a03a,#c96a08)}
/* ===== Notifikasi, toast, obrolan, AI, ulasan ===== */
.btm{grid-template-columns:repeat(6,1fr);width:min(calc(100% - 24px),640px)}
.btm button{min-width:0;font-size:10px;padding:8px 0}.btm .n{right:calc(50% - 24px)}
.bell{position:relative;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--pine);transition:.15s}
.bell:hover{background:var(--bg)}.bell.has{color:var(--green)}
.bell.ring svg{animation:bring 1.2s ease}
@keyframes bring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}
.bn{position:absolute;top:0;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#d84b42;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px #d84b4255}
.np{position:fixed;z-index:150;top:90px;right:16px;width:min(400px,calc(100vw - 24px));max-height:min(640px,calc(100dvh - 110px));display:flex;flex-direction:column;background:#fff;border:1px solid #efe3d1;border-radius:22px;box-shadow:0 30px 70px #1a110a40;overflow:hidden;animation:npin .2s ease-out}
@keyframes npin{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.nph{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.nph b{font-size:16px;letter-spacing:-.3px}.nph span{font-size:11px;font-weight:800;color:#fff;background:var(--green);padding:2px 9px;border-radius:99px}.nph span:empty{display:none}
.nl{margin-left:auto;font-size:12px;font-weight:700;color:var(--green)}
.npl{overflow-y:auto;flex:1;min-height:90px}.npl .empty{padding:30px 16px}
.ni{position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 18px 13px 22px;text-align:left;border-bottom:1px solid #f4eee4;background:#fff}
.ni:hover{background:#fffaf2}.ni.un{background:#fff8ec}
.ni.un::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:var(--green)}
.nic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:#fff1dc}.ni.chat .nic{background:#e3eefb}.ni.review .nic{background:#fff6d6}
.nib{flex:1;min-width:0}.nib b{display:block;font-size:13px;overflow-wrap:anywhere}
.nib small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.nit{font-size:11px;color:var(--mut);white-space:nowrap}
.npf{padding:12px 18px;border-top:1px solid var(--line);display:grid;gap:9px;background:#fdfaf5}
.nrow{display:flex;align-items:center;gap:9px;margin:0;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.nrow input{width:18px;height:18px;padding:0;flex:none;accent-color:var(--green)}
/* toast */
.toasts{position:fixed;z-index:200;top:calc(14px + env(safe-area-inset-top));right:14px;display:grid;gap:10px;width:min(390px,calc(100vw - 28px));pointer-events:none}
.tt{position:relative;pointer-events:auto;display:flex;gap:12px;align-items:flex-start;padding:14px 12px 17px 14px;background:#fff;border:1px solid #efe3d1;border-radius:18px;box-shadow:0 18px 44px #1a110a33;overflow:hidden;animation:ttin .38s cubic-bezier(.2,.9,.3,1.15)}
.tt.out{animation:ttout .22s ease-in forwards}
@keyframes ttin{from{opacity:0;transform:translateX(30px) scale(.96)}}
@keyframes ttout{to{opacity:0;transform:translateX(30px) scale(.96)}}
.ti{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:800;background:#e8f1fb;color:#2b6cb0}
.tt.ok .ti{background:#e6f6ec;color:#1f9d55}.tt.err .ti{background:#fde7e5;color:#c8443b}
