<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a110a"><title>Pusat Kendali — WARUNGKU</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--rail:#1a110a;--bg:#f4f1ec;--card:#fff;--line:#e6dfd5;--ink:#241a11;--mut:#7a6d60;--or:#e07b0f;--ok:#16864a;--warn:#c27a0a;--bad:#c8443b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}[hidden]{display:none!important}
h1,h2,h3,p{margin:0}:focus-visible{outline:3px solid #f5c78a;outline-offset:2px}
.btn{padding:9px 15px;border-radius:11px;font-weight:700;background:#fff;border:1px solid var(--line)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.no{color:var(--bad)}.btn.sm{padding:6px 11px;font-size:12px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 480px at 80% 0,#5a330f 0,transparent 60%),var(--rail)}
.gb{width:min(100%,380px);background:#fff;border-radius:24px;padding:30px 26px}.gb h1{font-size:22px;letter-spacing:-.5px;margin:16px 0 4px}.gb p{color:var(--mut);margin-bottom:16px}
.gb input{margin-bottom:10px}.gb .btn{width:100%;padding:13px}.er{color:var(--bad);font-size:12px;font-weight:600;min-height:18px;margin-bottom:6px}
.mk{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#ffb347,#e07b0f)}
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--rail);color:#e8d9c6;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.rail .br{display:flex;gap:11px;align-items:center;padding:0 8px 22px}.br b{display:block;color:#fff;line-height:1.2}.br span{font-size:11px;opacity:.65}
.tb{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;font-weight:600;color:#e8d9c6;width:100%;text-align:left}
.tb:hover{background:#ffffff12}.tb.on{background:#fff;color:var(--rail)}.tb svg{width:19px;height:19px;flex:none}
.tb .n{margin-left:auto;background:var(--or);color:#2b1500;border-radius:99px;font-size:11px;font-weight:800;padding:0 7px;min-width:20px;text-align:center}
.rail .out{margin-top:auto}
main{padding:28px clamp(16px,3vw,40px) 40px;max-width:1040px;width:100%}
.hd{margin-bottom:20px}.hd h2{font-size:24px;letter-spacing:-.6px}.hd p{color:var(--mut)}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.seg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;color:var(--mut);font-weight:600;font-size:12px}
.seg b{display:block;font-size:24px;color:var(--ink);letter-spacing:-.5px}.seg.on{border-color:var(--or);box-shadow:0 0 0 3px #e07b0f22}
.tool{display:flex;gap:10px;margin-bottom:14px}.tool select{width:150px}
.leg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:14px;border-radius:14px;background:#fff6e6;border:1px solid #f1d9a8}
.uc{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.av{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;background:#e8efe9;color:var(--ok)}.av.a{background:#ffe9cc;color:#b55f06}
.ub{flex:1;min-width:0}.ub h3{font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ub p{color:var(--mut);font-size:13px;word-break:break-word}.ub small{color:var(--mut);font-size:12px}
.tg{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#e8efe9;color:var(--ok)}.tg.ta{background:#ffe9cc;color:#b55f06}.tg.fo{background:#e3f4ea;color:var(--ok)}.tg.fs{background:#fdecc8;color:var(--warn)}.tg.fn{background:#fbe3e0;color:var(--bad)}
.ua{display:flex;flex-direction:column;gap:6px}.empty{text-align:center;color:var(--mut);padding:44px 10px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.hero{background:var(--rail);color:#fff;border-radius:24px;padding:24px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:14px}
.pulse{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--c);position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:pl 2.2s ease-out infinite}
.pulse svg{width:38px;height:38px;position:relative;z-index:1;color:#fff}@keyframes pl{to{transform:scale(1.7);opacity:0}}
.hero h3{font-size:26px;letter-spacing:-.6px}.hero p{color:#cdbba5}.hero svg.bars{grid-column:1/-1;width:100%;height:56px}
.l0{--c:#16a05a}.l1{--c:#e0a10f}.l2{--c:#d84b42}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.sw{display:flex;align-items:center;gap:8px;font-weight:700;margin-left:auto}.sw input{width:40px;height:22px;appearance:none;border-radius:99px;background:#d5cdc1;position:relative;padding:0;border:0;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked{background:var(--ok)}.sw input:checked::after{left:21px}
.plan{background:#fff;border:1px solid var(--line);border-left:4px solid var(--or);border-radius:16px;padding:16px;margin-bottom:14px}.plan li{margin:4px 0;color:var(--mut)}.plan ul{padding-left:18px;margin:8px 0 12px}
.feed{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ev{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}.ev:last-child{border:0}
.ev i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--c)}.ev.s1{--c:#16a05a}.ev.s2{--c:#e0a10f}.ev.s3{--c:#d84b42}.ev.fx{opacity:.55}.ev.fx i{background:#aaa}
.ev div{flex:1;min-width:0}.ev p{font:12.5px/1.45 ui-monospace,Menlo,monospace;color:var(--mut);word-break:break-all}.ev small{color:var(--mut);font-size:12px}.ev .ua{flex-direction:row}
dialog{border:0;border-radius:22px;padding:22px;width:min(92vw,380px)}dialog::backdrop{background:#1a110a99}dialog h3{margin-bottom:10px}dialog textarea{min-height:80px;margin-bottom:12px}dialog .ua{flex-direction:row;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--rail);color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9}#toast.on{opacity:1}
@media(max-width:820px){#app{display:block}.rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}.rail .br{display:none}.tb{flex-direction:column;gap:2px;font-size:11px;justify-content:center;padding:7px;text-align:center}.tb .n{position:absolute;margin:0;transform:translate(14px,-8px)}.tb{position:relative}.rail .out{margin:0;width:auto}main{padding-bottom:90px}.cnt{grid-template-columns:1fr 1fr}.uc{flex-wrap:wrap}.ua{flex-direction:row;width:100%}.ua .btn{flex:1}.hero{grid-template-columns:1fr;text-align:center}.pulse{margin:auto}}
@media(prefers-reduced-motion:reduce){.pulse::after{animation:none}}
</style></head><body>
<div id="gate"><form class="gb" id="lf"><div class="mk">🛡️</div><h1>Pusat Kendali</h1><p>Khusus pengelola pusat WARUNGKU.</p>
<input id="lm" type="email" placeholder="Email pusat" autocomplete="username" required><input id="lp" type="password" placeholder="Kata sandi" autocomplete="current-password" required>
<div class="er" id="le" role="alert"></div><button class="btn pri">Masuk</button></form></div>

<div id="app" hidden>
<nav class="rail"><div class="br"><div class="mk">🛡️</div><div><b>Pusat Kendali</b><span>WARUNGKU</span></div></div>
<button class="tb on" data-t="ver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>Verifikasi<span class="n" id="bd" hidden>0</span></button>
<button class="tb" data-t="sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Keamanan<span class="n" id="bs" hidden>0</span></button>
<button class="tb out" data-a="out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Keluar</button></nav>
<main>
<section id="t-ver"><div class="hd"><h2>Verifikasi akun</h2><p>Setujui atau tolak pendaftar baru. Akun belum disetujui tidak bisa masuk.</p></div>
<div class="cnt" id="cnt"></div>
<div class="leg" id="leg" hidden><span></span><button class="btn sm" data-a="legacy">Setujui semua</button></div>
<div class="tool"><input id="q" type="search" placeholder="Cari nama, Gmail, nomor…"><select id="rl"><option value="">Semua peran</option><option value="admin">Penjual</option><option value="customer">Pelanggan</option></select></div>
<div id="list"></div></section>

<section id="t-sec" hidden><div class="hd"><h2>Monitor keamanan</h2><p>Kejadian dari semua perangkat masuk ke sini secara langsung.</p></div>
<div class="hero l0" id="hero"><div class="pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg></div><div><h3 id="hl">Aman</h3><p id="hs"></p></div><svg class="bars" id="bars" viewBox="0 0 288 56" preserveAspectRatio="none" aria-label="Kejadian 24 jam terakhir"></svg></div>
<div class="ctl"><button class="btn" data-a="scan">Pindai database</button><button class="btn pri" data-a="ai">Analisis AI</button><label class="sw"><input type="checkbox" id="auto"> Perbaikan otomatis</label></div>
<div class="plan" id="plan" hidden></div>
<ul class="feed" id="feed"></ul></section>
</main></div>

<dialog id="dlg"><form method="dialog"><h3 id="dt"></h3><textarea id="dr" placeholder="Alasan (akan dilihat pengguna)"></textarea><div class="ua"><button class="btn" value="x">Batal</button><button class="btn pri" value="go">Kirim</button></div></form></dialog>
<div id="toast" role="status"></div>

<script>/* Opsional: alamat proxy AI milik Anda (Cloud Function). Kosong = mesin aturan lokal. */window.PUSAT_AI={endpoint:""};</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,set,get,update,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyAvX3WWZQcuZFwiWzn3Syzg9gtWpkhoWq0",authDomain:"warungku-f57fe.firebaseapp.com",databaseURL:"https://warungku-f57fe-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"warungku-f57fe",appId:"1:673408074768:web:aed0ac7d91cb2676037695"},"pusat");
const auth=getAuth(app),db=getDatabase(app),$=i=>document.getElementById(i);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me=null,users={},evs={},tab="ver",flt="pending",offs=[],plan=null,working=false;
const st=u=>u.status||"approved",err=e=>toast("Gagal: "+(e.code||e.message));
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove("on"),2600)};
const ago=t=>{if(!t)return"";const s=(Date.now()-t)/1e3;return s<60?"baru saja":s<3600?Math.floor(s/60)+" menit lalu":s<86400?Math.floor(s/3600)+" jam lalu":Math.floor(s/86400)+" hari lalu"};
const TYPE={"script-injection":"Skrip asing diblokir","frame":"Upaya clickjacking","brute-force":"Percobaan masuk berulang","payload":"Konten berbahaya di database","lonjakan":"Lonjakan pendaftaran","link-asing":"Tautan/form mencurigakan"};
const BLOCK=["script-injection","frame","link-asing"];

/* ---------- Masuk pusat ---------- */
$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";try{await signInWithEmailAndPassword(auth,$("lm").value.trim(),$("lp").value)}catch(x){$("le").textContent="Email atau kata sandi salah."}};
onAuthStateChanged(auth,async u=>{offs.forEach(f=>f());offs=[];
  if(!u){me=null;$("gate").hidden=false;$("app").hidden=true;return}
  let ok=false;try{ok=(await get(ref(db,"pusat/"+u.uid))).val()===true}catch(e){}
  if(!ok){$("le").textContent="Akun ini tidak punya akses pusat.";await signOut(auth);return}
  me=u;$("gate").hidden=true;$("app").hidden=false;
  offs.push(onValue(ref(db,"users"),s=>{users=s.val()||{};draw()},err),onValue(ref(db,"security/events"),s=>{evs=s.val()||{};draw();if($("auto").checked)run()},err));
});

/* ---------- Tampilan ---------- */
const openEv=()=>Object.entries(evs).map(([id,e])=>({id,...e})).filter(e=>e.status!=="fixed");
function draw(){
  const L=Object.entries(users).map(([id,u])=>({id,...u})),c=k=>L.filter(u=>st(u)===k).length;
  $("bd").hidden=!c("pending");$("bd").textContent=c("pending");const o=openEv();$("bs").hidden=!o.length;$("bs").textContent=o.length;
  $("t-ver").hidden=tab!=="ver";$("t-sec").hidden=tab!=="sec";
  document.querySelectorAll(".tb[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  tab==="ver"?drawVer(L,c):drawSec();
}
function drawVer(L,c){
  $("cnt").innerHTML=[["pending","Menunggu"],["approved","Disetujui"],["rejected","Ditolak"],["suspended","Ditangguhkan"]].map(([k,n])=>`<button class="seg ${flt===k?"on":""}" data-f="${k}"><b>${c(k)}</b>${n}</button>`).join("");
  const leg=L.filter(u=>!u.status).length;$("leg").hidden=!leg;$("leg").firstElementChild.textContent=leg+" akun lama belum punya status verifikasi.";
  const q=$("q").value.toLowerCase(),rl=$("rl").value;
  const R=L.filter(u=>st(u)===flt&&(!rl||u.role===rl)&&(!q||[u.name,u.shop,u.email,u.wa,u.address].join(" ").toLowerCase().includes(q))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  $("list").innerHTML=R.length?R.map(card).join(""):`<div class="empty">Tidak ada akun di daftar ini.</div>`;
}
const face=f=>f==="ok"?'<span class="tg fo">Wajah terverifikasi</span>':f==="skip"?'<span class="tg fs">Wajah dilewati</span>':f==="none"?'<span class="tg fn">Tanpa verifikasi wajah</span>':"";
function card(u){const s=st(u),adm=u.role==="admin",nm=u.shop||u.name||"(tanpa nama)";
  const a=s==="pending"?`<button class="btn sm ok" data-a="ok" data-id="${u.id}">Setujui</button><button class="btn sm no" data-a="no" data-id="${u.id}">Tolak</button>`:s==="approved"?`<button class="btn sm no" data-a="sus" data-id="${u.id}">Tangguhkan</button>`:`<button class="btn sm ok" data-a="ok" data-id="${u.id}">Setujui ulang</button>`;
  return `<article class="uc"><div class="av ${adm?"a":""}">${esc(nm[0]||"?").toUpperCase()}</div><div class="ub"><h3>${esc(nm)} <span class="tg ${adm?"ta":""}">${adm?"Penjual":"Pelanggan"}</span>${adm?"":face(u.face)}</h3><p>${esc(u.email)}<br>WA ${esc(u.wa||u.phone)}</p><p>${esc(u.address)}</p><small>${ago(u.createdAt)}${u.reason?" — Alasan: "+esc(u.reason):""}</small></div><div class="ua">${a}</div></article>`}
function drawSec(){
  const E=Object.entries(evs).map(([id,e])=>({id,...e})).sort((a,b)=>b.t-a.t),o=E.filter(e=>e.status!=="fixed"),day=E.filter(e=>Date.now()-e.t<864e5);
  const lv=o.some(e=>e.sev>=3)?2:o.length?1:0;$("hero").className="hero l"+lv;
  $("hl").textContent=["Aman","Waspada","Terancam"][lv];$("hs").textContent=`${o.length} kejadian terbuka, ${day.length} dalam 24 jam terakhir.`;
  const b=Array(24).fill(0);day.forEach(e=>{const i=23-Math.floor((Date.now()-e.t)/36e5);if(i>=0)b[i]++});const m=Math.max(1,...b);
  $("bars").innerHTML=b.map((v,i)=>`<rect x="${i*12+1}" y="${56-Math.max(2,v/m*52)}" width="9" height="${Math.max(2,v/m*52)}" rx="2" fill="${v?"#f49a38":"#ffffff22"}"/>`).join("");
  $("feed").innerHTML=E.length?E.slice(0,60).map(e=>`<li class="ev s${e.sev||1} ${e.status==="fixed"?"fx":""}"><i></i><div><b>${esc(TYPE[e.type]||e.type)}</b><p>${esc(e.msg)}</p><small>${esc(e.role)} — ${ago(e.t)}${e.status==="fixed"?" — "+esc(e.fix||"Diperbaiki"):""}</small></div>${e.status==="fixed"?"":`<div class="ua"><button class="btn sm pri" data-a="fix" data-id="${e.id}">Perbaiki</button><button class="btn sm" data-a="ign" data-id="${e.id}">Abaikan</button></div>`}</li>`).join(""):`<li class="ev"><div>Belum ada kejadian. Ketuk "Pindai database" untuk memeriksa sekarang.</div></li>`;
  if(plan){$("plan").hidden=false;$("plan").innerHTML=`<b>Hasil analisis (${plan.src})</b><p>${esc(plan.summary)}</p>${plan.actions.length?`<ul>${plan.actions.map(a=>`<li>${esc(a.type==="sanitize"?"Bersihkan teks":a.type==="suspend"?"Tangguhkan akun":"Tutup catatan")} — ${esc(a.why||a.path||"")}</li>`).join("")}</ul><button class="btn ok sm" data-a="apply">Terapkan semua</button>`:""}`}else $("plan").hidden=true;
}

/* ---------- Verifikasi ---------- */
const decide=(id,status,reason)=>update(ref(db,"users/"+id),{status,reason:reason||null,by:me.uid,decidedAt:Date.now()}).then(()=>toast({approved:"Akun disetujui",rejected:"Akun ditolak",suspended:"Akun ditangguhkan"}[status])).catch(err);
function ask(t,cb){const d=$("dlg");$("dt").textContent=t;$("dr").value="";d.returnValue="";d.showModal();d.onclose=()=>d.returnValue==="go"&&cb($("dr").value.trim())}

/* ---------- Pemindaian + AI ---------- */
const BAD=/<\s*\/?\s*(script|iframe|object|embed|svg|img|link|style)\b|javascript:|\bon(error|load|click|mouseover|focus)\s*=|data:text\/html/i;
const clean=s=>s.replace(/<[^>]*>?/g,"").replace(/javascript:|data:text\/html/gi,"").replace(/\bon\w+\s*=/gi,"").trim();
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
function walk(v,p,uid,out){if(typeof v==="string"){if(BAD.test(v))out.push({path:p,uid});return}
  if(v&&typeof v==="object"){const u=v.uid||((p.startsWith("chats/")||p.startsWith("users/"))&&p.split("/")[1])||uid;for(const k in v)walk(v[k],p+"/"+k,u,out)}}
async function scan(){toast("Memindai database…");const out=[];
  for(const k of ["chats","reviews","orders","products","users"]){try{walk((await get(ref(db,k))).val(),k,"",out)}catch(e){}}
  let n=0;for(const f of out){const id="scan_"+hash(f.path);if(evs[id])continue;n++;await set(ref(db,"security/events/"+id),{t:Date.now(),type:"payload",sev:3,role:"database",msg:"Pola berbahaya di "+f.path,path:f.path,uid:f.uid||null,status:"open"}).catch(err)}
  const rec=Object.values(users).filter(u=>st(u)==="pending"&&Date.now()-(u.createdAt||0)<6e5).length,fid="flood_"+Math.floor(Date.now()/36e5);
  if(rec>=5&&!evs[fid]){n++;await set(ref(db,"security/events/"+fid),{t:Date.now(),type:"lonjakan",sev:2,role:"pendaftaran",msg:rec+" pendaftar baru dalam 10 menit (kemungkinan bot)",status:"open"}).catch(err)}
  toast(n?n+" temuan baru":"Tidak ada ancaman ditemukan")}
async function analyze(list){
  const ep=window.PUSAT_AI.endpoint;
  if(ep){try{const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({events:list.map(({id,type,sev,msg,path,uid})=>({id,type,sev,msg,path,uid}))})}),j=await r.json();
    return{src:"AI",summary:String(j.summary||""),actions:(j.actions||[]).filter(a=>["sanitize","suspend","dismiss"].includes(a.type)&&list.some(e=>e.id===a.id)&&(a.type!=="sanitize"||a.path===list.find(e=>e.id===a.id).path))}}catch(e){toast("AI tidak terjangkau, memakai mesin lokal")}}
  const acts=[],byUid={};openEv().forEach(e=>e.uid&&(byUid[e.uid]=(byUid[e.uid]||0)+1));const done=new Set();
  for(const e of list){
    if(e.path)acts.push({id:e.id,type:"sanitize",path:e.path,why:e.path});
    if(e.path&&e.uid&&users[e.uid]&&e.uid!==me.uid&&byUid[e.uid]>=2&&!done.has(e.uid)){done.add(e.uid);acts.push({id:e.id,type:"suspend",uid:e.uid,why:"pengirim ≥2 konten berbahaya"})}
    if(!e.path&&BLOCK.includes(e.type))acts.push({id:e.id,type:"dismiss",why:"sudah diblokir di peramban"})}
  const manual=list.length-new Set(acts.map(a=>a.id)).size;
  return{src:"mesin aturan lokal",summary:`${list.length} kejadian terbuka. ${acts.length} perbaikan aman siap diterapkan${manual?`, ${manual} perlu tinjauan manual`:""}.`,actions:acts}}
const fix=(id,t)=>update(ref(db,"security/events/"+id),{status:"fixed",fixedAt:Date.now(),fix:t});
async function apply(acts){let n=0;for(const a of acts){try{
  if(a.type==="sanitize"){const s=(await get(ref(db,a.path))).val();if(typeof s==="string")await set(ref(db,a.path),clean(s));await fix(a.id,"Teks dibersihkan")}
  else if(a.type==="suspend"){await update(ref(db,"users/"+a.uid),{status:"suspended",reason:"Konten berbahaya terdeteksi",by:me.uid,decidedAt:Date.now()});await fix(a.id,"Teks dibersihkan, akun ditangguhkan")}
  else await fix(a.id,a.why);n++}catch(e){err(e)}}return n}
async function run(){if(working)return;working=true;try{const o=openEv();if(o.length){const p=await analyze(o);if(p.actions.length)await apply(p.actions)}}finally{working=false}}

/* ---------- Aksi ---------- */
$("auto").checked=localStorage.getItem("pz_auto")==="1";
$("auto").onchange=e=>{localStorage.setItem("pz_auto",e.target.checked?"1":"0");e.target.checked&&run()};
$("q").oninput=$("rl").onchange=draw;
document.addEventListener("click",async e=>{const t=e.target.closest("[data-t],[data-f],[data-a]");if(!t)return;const d=t.dataset,id=d.id;
  if(d.t){tab=d.t;draw()}else if(d.f){flt=d.f;draw()}
  else if(d.a==="ok")decide(id,"approved");
  else if(d.a==="no")ask("Tolak pendaftaran",r=>decide(id,"rejected",r));
  else if(d.a==="sus")ask("Tangguhkan akun",r=>decide(id,"suspended",r));
  else if(d.a==="legacy"){const u={};Object.entries(users).forEach(([k,v])=>{if(!v.status)u[k+"/status"]="approved"});update(ref(db,"users"),u).then(()=>toast("Akun lama disetujui")).catch(err)}
  else if(d.a==="scan")scan();
  else if(d.a==="ai"){const o=openEv();plan=await analyze(o);draw()}
  else if(d.a==="apply"){const n=await apply(plan.actions);plan=null;toast(n+" perbaikan diterapkan")}
  else if(d.a==="fix"){const e1=openEv().filter(x=>x.id===id),p=await analyze(e1);p.actions.length?(await apply(p.actions),toast("Diperbaiki")):toast("Perlu tinjauan manual")}
  else if(d.a==="ign")fix(id,"Diabaikan pusat").catch(err);
  else if(d.a==="out")signOut(auth)});
</script></body></html>
